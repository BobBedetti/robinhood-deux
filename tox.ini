[tox]
envlist =
    3.11-django4.2

    flake8
    cov

[testenv]
deps=
    -r{toxinidir}/requirements/default.txt
    -r{toxinidir}/requirements/test.txt
    -r{toxinidir}/requirements/test-ci.txt

    django4.2: -r{toxinidir}/requirements/test-django42.txt

sitepackages = False
recreate = False
commands = pytest --cov-report=xml

basepython =
    3.11,flake8,cov: python3.11

[testenv:flake8]
deps = flake8>=5.0
commands =
    flake8 {toxinidir}/deux

[testenv:cov]
commands =
    pytest -xv --cov-report=xml
